name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev deps)
        run: pip install -e .[dev]

      - name: Run test suite
        run: pytest

      - name: Check and run all examples
        run: |
          set -u
          fail=0
          count=0
          for f in examples/*.tn; do
            count=$((count + 1))
            echo "=== tantu check $f ==="
            if ! tantu check "$f"; then
              echo "FAIL: tantu check $f exited non-zero"
              fail=1
            fi
            echo "=== tantu run $f ==="
            if ! tantu run "$f"; then
              echo "FAIL: tantu run $f exited non-zero"
              fail=1
            fi
          done
          echo "Ran $count examples"
          if [ "$count" -eq 0 ]; then
            echo "FAIL: no examples found"
            fail=1
          fi
          exit "$fail"
