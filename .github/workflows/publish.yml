# Publish tantu to PyPI via trusted publishing (OIDC) — no API token stored in the repo.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/ → "Add a new pending publisher"):
#   PyPI project name: tantu
#   Owner:             DRACULA1729
#   Repository:        tantu-lang
#   Workflow name:     publish.yml
#   Environment name:  pypi
#
# Fires when a GitHub release is published. For a release that already exists (v0.1.0),
# run it manually: Actions → "Publish to PyPI" → Run workflow → ref = the tag.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite against the exact ref being published
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tantu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
